name: IdenticalHunters
version: ${project.version}
main: com.github.tejaslamba2006.identicalhunters.IdenticalHunters
api-version: "1.21"
authors: [TejasLamba2006]
description: Make all hunters look identical for manhunt games - uses disguises or stealth mode
website: https://github.com/TejasLamba2006/IdenticalHunters
softdepend: [ProtocolLib, LibsDisguises]

commands:
  identicalhunters:
    description: Main command for IdenticalHunters
    usage: /<command> <start|stop|sethunter|removehunter|list|settarget|info|reload>
    aliases: [ih, hunters, manhunt]
    permission: identicalhunters.admin
  hunter:
    description: Toggle hunter status for a player
    usage: /<command> <add|remove> <player>
    permission: identicalhunters.admin

permissions:
  identicalhunters.admin:
    description: Access to all IdenticalHunters commands
    default: op
  identicalhunters.bypass:
    description: Bypass being disguised as a hunter
    default: false
